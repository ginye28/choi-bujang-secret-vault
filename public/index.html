<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a2a3d">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { box-sizing: border-box; width: min(100% - 32px, 620px); margin: 32px auto; padding: 30px; border: 1px solid #40566f; border-radius: 20px; background: #1a2a3d; box-shadow: 0 18px 50px #0004; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 12px 0 8px; font-size: clamp(28px, 7vw, 38px); }
    h2 { margin-top: 28px; }
    p { color: #bfd0e5; line-height: 1.6; }
    form { display: grid; gap: 14px; margin-top: 24px; }
    label { display: grid; gap: 7px; color: #dce8f6; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 12px 13px; border: 1px solid #60758b; border-radius: 10px; background: #101a28; color: #fff; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #8ad8df; outline-offset: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    button { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #10202d; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { border: 1px solid #70869d; background: transparent; color: #ecf4ff; }
    button.danger { border: 1px solid #bd7180; background: transparent; color: #ffadb9; }
    button:disabled { cursor: wait; opacity: .65; }
    [hidden] { display: none !important; }
    #status, #notes-status { min-height: 1.5em; margin: 16px 0 0; overflow-wrap: anywhere; }
    #status[data-error="true"], #notes-status[data-error="true"] { color: #ffadb9; }
    #signed-in-email { overflow-wrap: anywhere; color: #fff; font-weight: 700; }
    #notes-list { display: grid; gap: 12px; margin: 16px 0 0; padding: 0; list-style: none; }
    #notes-list li { padding: 14px; border: 1px solid #40566f; border-radius: 10px; background: #142235; }
    #notes-list h3 { margin: 0 0 8px; color: #8ad8df; overflow-wrap: anywhere; }
    #notes-list p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-actions { margin-top: 14px; }
    .edit-form { margin-top: 8px; }
    #offline-note { display: none; padding: 10px 12px; border: 1px solid #bd9f71; border-radius: 10px; color: #ffe0a8; }
    #offline-note[data-offline="true"] { display: block; }
    #device-panel { margin-top: 20px; padding: 14px; border: 1px solid #40566f; border-radius: 12px; background: #142235; }
    #device-state { font-weight: 700; }
    #device-note { margin: 8px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 자료실</div>
    <p id="offline-note" role="status" data-offline="false">오프라인입니다. 보호 자료는 서버가 기기를 확인한 뒤에만 열리므로 오프라인에서는 표시되지 않습니다.</p>
    <h1>이메일 로그인</h1>
    <section id="login-view" aria-label="이메일 로그인">
      <p>이메일과 비밀번호로 로그인하거나 새 계정을 만드세요.</p>
      <form id="auth-form">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button id="login-button" type="submit">로그인</button>
          <button id="signup-button" class="secondary" type="button">회원가입</button>
        </div>
      </form>
    </section>
    <section id="signed-in-view" aria-label="로그인 상태" hidden>
      <p>로그인된 이메일</p>
      <p id="signed-in-email"></p>
      <button id="logout-button" class="secondary" type="button">로그아웃</button>
      <section id="device-panel" aria-labelledby="device-heading">
        <h2 id="device-heading" style="margin-top:0">기기 승인 상태</h2>
        <p id="device-state" role="status" aria-live="polite">확인 전</p>
        <div class="actions">
          <button id="device-request-button" type="button">이 기기 승인 요청</button>
          <button id="device-refresh-button" class="secondary" type="button" hidden>상태 다시 확인</button>
        </div>
        <p id="device-note">앱을 설치했다는 표시나 이 버튼만으로는 기기 확인이 끝나지 않습니다. 서버가 이 기기를 등록 기기로 확인한 뒤에만 자료가 열립니다. 기기 키는 이 화면의 메모리에만 있고 브라우저 저장소에 저장하지 않습니다.</p>
      </section>
      <section id="notes-section" aria-labelledby="notes-heading" hidden>
        <h2 id="notes-heading">내 가상 메모</h2>
        <form id="add-note-form">
          <label for="new-title">제목</label>
          <input id="new-title" name="title" maxlength="200" required>
          <label for="new-body">내용</label>
          <textarea id="new-body" name="body" required></textarea>
          <div class="actions"><button type="submit">메모 추가</button></div>
        </form>
        <p id="notes-status" role="status" aria-live="polite"></p>
        <ul id="notes-list"></ul>
      </section>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    const loginView = document.querySelector('#login-view');
    const signedInView = document.querySelector('#signed-in-view');
    const authForm = document.querySelector('#auth-form');
    const passwordInput = document.querySelector('#password');
    const status = document.querySelector('#status');
    const notesStatus = document.querySelector('#notes-status');
    const notesList = document.querySelector('#notes-list');
    const buttons = [...document.querySelectorAll('button')];
    const TOKEN_KEY = 'access_token';
    const EMAIL_KEY = 'user_email';
    let notesRequestId = 0;

    // 기기 키쌍은 메모리에서만 만들고 저장하지 않습니다(새로고침하면 다시 승인 요청). 비공개 키는 꺼낼 수 없게 만듭니다.
    const deviceState = document.querySelector('#device-state');
    const deviceRequestButton = document.querySelector('#device-request-button');
    const deviceRefreshButton = document.querySelector('#device-refresh-button');
    const notesSection = document.querySelector('#notes-section');
    const offlineNote = document.querySelector('#offline-note');
    let device = null; // { privateKey, deviceId, status }

    function canonicalJson(value) {
      if (Array.isArray(value)) return '[' + value.map(canonicalJson).join(',') + ']';
      if (value !== null && typeof value === 'object') {
        return '{' + Object.keys(value).sort().map(key => JSON.stringify(key) + ':' + canonicalJson(value[key])).join(',') + '}';
      }
      return JSON.stringify(value);
    }

    async function sha256Hex(text) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function toBase64Url(buffer) {
      let binary = '';
      for (const byte of new Uint8Array(buffer)) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/[+]/g, '-').replace(/[/]/g, '_').replace(/=+$/, '');
    }

    // 방식·경로·본문 해시·시각·기기 번호를 묶어 서명합니다. 서명 뒤 경로나 본문이 바뀌면 서버가 거부합니다.
    async function proofHeaders(method, path, bodyText) {
      if (!device || device.status !== 'approved') return {};
      const timestamp = Math.floor(Date.now() / 1000);
      const bodyHash = await sha256Hex(bodyText ? canonicalJson(JSON.parse(bodyText)) : '');
      const message = ['aleph-device-proof-v1', method.toUpperCase(), path, bodyHash, String(timestamp), device.deviceId].join('\n');
      const signature = await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, device.privateKey, new TextEncoder().encode(message));
      return {
        'X-Aleph-App': 'installed', 'X-Aleph-Device': device.deviceId,
        'X-Aleph-Ts': String(timestamp), 'X-Aleph-Sig': toBase64Url(signature)
      };
    }

    function showDeviceState(text) {
      deviceState.textContent = text;
    }

    function applyDeviceStatus(status) {
      if (device) device.status = status;
      const approved = status === 'approved';
      notesSection.hidden = !approved;
      deviceRefreshButton.hidden = approved || !device;
      deviceRequestButton.hidden = Boolean(device);
      if (approved) {
        showDeviceState('승인됨 — 서버가 이 기기를 등록 기기로 확인했습니다.');
        void loadNotes();
      } else if (status === 'pending') {
        showDeviceState('승인 대기 — 서버가 아직 이 기기를 확인하지 않았습니다. 자료는 표시되지 않습니다.');
        notesList.replaceChildren();
      } else {
        showDeviceState('확인 전 — 기기 승인을 요청하세요. 승인 전에는 자료가 표시되지 않습니다.');
        notesList.replaceChildren();
      }
    }

    async function deviceApi(options) {
      const accessToken = sessionStorage.getItem(TOKEN_KEY);
      if (!accessToken) throw new Error('로그인이 필요합니다.');
      const response = await fetch('/api/device' + (options.query || ''), {
        method: options.method,
        headers: { Accept: 'application/json', 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      let result;
      try { result = await response.json(); } catch { result = null; }
      if (!response.ok) throw new Error(result?.error || '기기 확인 요청 실패 (' + response.status + ')');
      return result;
    }

    async function requestDeviceApproval() {
      setBusy(true);
      showDeviceState('서버에 승인을 요청하는 중입니다.');
      try {
        const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
        const jwk = await crypto.subtle.exportKey('jwk', pair.publicKey);
        const result = await deviceApi({
          method: 'POST', body: { action: 'request', publicKey: { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y } }
        });
        device = { privateKey: pair.privateKey, deviceId: result.deviceId, status: result.status };
        applyDeviceStatus(result.status);
      } catch (error) {
        device = null;
        applyDeviceStatus('unknown');
        showDeviceState('승인 요청을 완료하지 못했습니다: ' + (error.message || '알 수 없는 오류'));
      } finally {
        setBusy(false);
      }
    }

    async function refreshDeviceStatus() {
      if (!device) return;
      try {
        const result = await deviceApi({ method: 'GET', query: '?deviceId=' + encodeURIComponent(device.deviceId) });
        applyDeviceStatus(result.status);
      } catch (error) {
        showDeviceState('상태를 확인하지 못했습니다: ' + (error.message || '알 수 없는 오류'));
      }
    }

    function updateOnlineState() {
      offlineNote.dataset.offline = String(navigator.onLine === false);
    }
    window.addEventListener('online', updateOnlineState);
    window.addEventListener('offline', updateOnlineState);
    updateOnlineState();
    deviceRequestButton.addEventListener('click', () => { void requestDeviceApproval(); });
    deviceRefreshButton.addEventListener('click', () => { void refreshDeviceStatus(); });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    function showMessage(message = '', isError = false) {
      status.textContent = message;
      status.dataset.error = String(isError);
    }

    function showNotesMessage(message = '', isError = false) {
      notesStatus.textContent = message;
      notesStatus.dataset.error = String(isError);
    }

    async function authRequest(action, email, password) {
      const response = await fetch('/api/auth', {
        method: 'POST',
        headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, email, password })
      });
      let result;
      try { result = await response.json(); } catch { result = null; }
      if (!response.ok) throw new Error(result?.message || '인증 요청을 완료하지 못했습니다.');
      return result;
    }

    async function notesRequest(path, options = {}) {
      const accessToken = sessionStorage.getItem(TOKEN_KEY);
      if (!accessToken) throw new Error('로그인이 필요합니다.');
      const proof = await proofHeaders(options.method || 'GET', path, options.body);
      const response = await fetch(path, {
        ...options,
        headers: {
          Accept: 'application/json',
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...options.headers,
          ...proof,
          Authorization: `Bearer ${accessToken}`
        }
      });
      let result;
      try { result = await response.json(); } catch { result = null; }
      if (!response.ok) throw new Error(result?.error || `요청 실패 (${response.status})`);
      return result;
    }

    function makeButton(label, className, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      if (className) button.className = className;
      button.addEventListener('click', onClick);
      return button;
    }

    function renderNotes(notes) {
      notesList.replaceChildren();
      for (const note of notes) {
        const item = document.createElement('li');
        const title = document.createElement('h3');
        const body = document.createElement('p');
        title.textContent = typeof note?.title === 'string' ? note.title : '';
        body.textContent = typeof note?.body === 'string' ? note.body : '';
        const actions = document.createElement('div');
        actions.className = 'actions note-actions';
        actions.append(
          makeButton('수정', 'secondary', () => editNote(item, note)),
          makeButton('삭제', 'danger', () => deleteNote(note.id))
        );
        item.append(title, body, actions);
        notesList.append(item);
      }
    }

    async function loadNotes() {
      const requestId = ++notesRequestId;
      notesList.replaceChildren();
      showNotesMessage('메모를 불러오는 중입니다.');
      try {
        const notes = await notesRequest('/api/notes');
        if (requestId !== notesRequestId) return;
        if (!Array.isArray(notes)) throw new Error('메모 응답 형식이 올바르지 않습니다.');
        renderNotes(notes);
        showNotesMessage(notes.length ? '' : '아직 메모가 없습니다. 위에서 메모를 추가하세요.');
      } catch (error) {
        if (requestId === notesRequestId) showNotesMessage(error.message || '메모를 불러오지 못했습니다.', true);
      }
    }

    async function editNote(item, note) {
      const form = document.createElement('form');
      form.className = 'edit-form';
      const titleLabel = document.createElement('label');
      titleLabel.textContent = '제목';
      const titleInput = document.createElement('input');
      titleInput.value = note.title || '';
      titleInput.maxLength = 200;
      titleInput.required = true;
      titleLabel.append(titleInput);
      const bodyLabel = document.createElement('label');
      bodyLabel.textContent = '내용';
      const bodyInput = document.createElement('textarea');
      bodyInput.value = note.body || '';
      bodyInput.required = true;
      bodyLabel.append(bodyInput);
      const actions = document.createElement('div');
      actions.className = 'actions';
      const cancel = makeButton('취소', 'secondary', () => { void loadNotes(); });
      const save = document.createElement('button');
      save.type = 'submit';
      save.textContent = '저장';
      actions.append(save, cancel);
      form.append(titleLabel, bodyLabel, actions);
      item.replaceChildren(form);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        setBusy(true);
        try {
          await notesRequest(`/api/notes/${encodeURIComponent(note.id)}`, {
            method: 'PUT', body: JSON.stringify({ title: titleInput.value, body: bodyInput.value })
          });
          showNotesMessage('메모를 수정했습니다.');
          await loadNotes();
        } catch (error) {
          showNotesMessage(error.message || '메모를 수정하지 못했습니다.', true);
        } finally {
          setBusy(false);
        }
      });
    }

    async function deleteNote(id) {
      if (!window.confirm('이 메모를 삭제할까요?')) return;
      setBusy(true);
      try {
        await notesRequest(`/api/notes/${encodeURIComponent(id)}`, { method: 'DELETE' });
        showNotesMessage('메모를 삭제했습니다.');
        await loadNotes();
      } catch (error) {
        showNotesMessage(error.message || '메모를 삭제하지 못했습니다.', true);
      } finally {
        setBusy(false);
      }
    }

    function setBusy(isBusy) {
      buttons.forEach(button => { button.disabled = isBusy; });
    }

    function renderUser(email) {
      const isSignedIn = Boolean(sessionStorage.getItem(TOKEN_KEY));
      loginView.hidden = isSignedIn;
      signedInView.hidden = !isSignedIn;
      if (isSignedIn) {
        document.querySelector('#signed-in-email').textContent = email || '이메일 정보 없음';
        passwordInput.value = '';
        device = null;
        applyDeviceStatus('unknown');
      } else {
        notesRequestId += 1;
        device = null;
        notesList.replaceChildren();
        notesSection.hidden = true;
        showNotesMessage();
      }
    }

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      setBusy(true);
      showMessage();
      try {
        const result = await authRequest(
          'login',
          document.querySelector('#email').value.trim(),
          passwordInput.value
        );
        if (typeof result?.access_token !== 'string' || !result.access_token) {
          throw new Error('로그인 응답을 확인할 수 없습니다.');
        }
        sessionStorage.setItem(TOKEN_KEY, result.access_token);
        sessionStorage.setItem(EMAIL_KEY, result.email || '');
        renderUser(result.email);
      } catch (error) {
        showMessage(error.message || '로그인 요청을 완료하지 못했습니다.', true);
      } finally {
        passwordInput.value = '';
        setBusy(false);
      }
    });

    document.querySelector('#signup-button').addEventListener('click', async () => {
      if (!authForm.reportValidity()) return;
      setBusy(true);
      showMessage();
      try {
        const result = await authRequest(
          'signup',
          document.querySelector('#email').value.trim(),
          passwordInput.value
        );
        if (typeof result?.access_token === 'string' && result.access_token) {
          sessionStorage.setItem(TOKEN_KEY, result.access_token);
          sessionStorage.setItem(EMAIL_KEY, result.email || '');
          renderUser(result.email);
        } else {
          showMessage('가입 요청이 완료되었습니다. 이메일 확인을 마친 뒤 로그인해 주세요.');
        }
      } catch (error) {
        showMessage(error.message || '회원가입 요청을 완료하지 못했습니다.', true);
      } finally {
        passwordInput.value = '';
        setBusy(false);
      }
    });

    document.querySelector('#logout-button').addEventListener('click', () => {
      sessionStorage.clear();
      renderUser(null);
      showMessage('로그아웃했습니다.');
    });

    document.querySelector('#add-note-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      setBusy(true);
      try {
        await notesRequest('/api/notes', {
          method: 'POST',
          body: JSON.stringify({ title: formData.get('title'), body: formData.get('body') })
        });
        form.reset();
        showNotesMessage('메모를 추가했습니다.');
        await loadNotes();
      } catch (error) {
        showNotesMessage(error.message || '메모를 추가하지 못했습니다.', true);
      } finally {
        setBusy(false);
      }
    });

    if (sessionStorage.getItem(TOKEN_KEY)) {
      renderUser(sessionStorage.getItem(EMAIL_KEY));
    } else {
      renderUser(null);
    }
  </script>
</body>
</html>
